# Uma origem só: o SPA e a API atrás do mesmo domínio. O frontend chama
# caminhos relativos (`/api/...`), então isto dispensa CORS e variável de URL.
server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Precisa acompanhar o teto da rota de upload (20 MB), com folga para o
  # envelope do multipart. Menor que isso, o nginx recusa o PDF antes de ele
  # chegar na API, com uma página HTML que a interface não sabe ler.
  client_max_body_size 25m;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # O nginx resolve host do upstream UMA VEZ, ao carregar a configuração: se o
  # container `api` for recriado e mudar de IP, ele continuaria mandando para o
  # IP velho e devolvendo 502 para sempre. Com o DNS do Docker (127.0.0.11) e o
  # destino numa variável, a resolução passa a ser por requisição. De quebra, o
  # nginx sobe mesmo que a API ainda não esteja de pé.
  resolver 127.0.0.11 valid=10s ipv6=off;

  location /api/ {
    set $upstream_api http://api:3333;
    proxy_pass $upstream_api$request_uri;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # A análise completa leva ~2 min (duas chamadas ao modelo em série).
    # O padrão do nginx é 60s e cortaria a resposta no meio.
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    # A rota de progresso transmite eventos durante a análise. Com buffer, o
    # nginx seguraria tudo e entregaria junto no fim — que é exatamente o que
    # o streaming existe para evitar.
    proxy_buffering off;
    proxy_cache off;
  }

  # Assets do Vite têm hash no nome: cache longo é seguro.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # SPA: qualquer rota desconhecida devolve o index.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
