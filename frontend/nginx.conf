# Uma origem só: o SPA e a API atrás do mesmo domínio. O frontend chama
# caminhos relativos (`/api/...`), então isto dispensa CORS e variável de URL.
server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Documentos colados podem ser longos, mas não são arquivos grandes.
  client_max_body_size 2m;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  location /api/ {
    proxy_pass http://api:3333;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # A análise completa leva ~2 min (duas chamadas ao modelo em série).
    # O padrão do nginx é 60s e cortaria a resposta no meio.
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
  }

  # Assets do Vite têm hash no nome: cache longo é seguro.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # SPA: qualquer rota desconhecida devolve o index.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
